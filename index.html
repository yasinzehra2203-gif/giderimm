<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f0c"><title>Giderim Aile</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><small>ORTAK HANE</small><h1>Giderim Aile</h1></div><button id="logoutBtn" class="ghost hidden">Çıkış</button></header><section id="authView" class="panel"><h2>Ortak hesaba giriş</h2><p class="muted">Sen ve Zehra aynı hesabı kullanarak kayıtları birlikte görebilirsiniz.</p><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><div class="row"><button id="loginBtn" class="primary">Giriş Yap</button><button id="registerBtn" class="secondary">Hesap Aç</button></div><p id="authMsg" class="error"></p></section><section id="appView" class="hidden"><div class="monthbar"><button id="prevMonth">‹</button><strong id="monthLabel"></strong><button id="nextMonth">›</button></div><div class="cards"><div class="card income"><span>Gelir</span><b id="income">0,00 TL</b></div><div class="card expense"><span>Gider</span><b id="expense">0,00 TL</b></div><div class="card balance"><span>Kalan</span><b id="balance">0,00 TL</b></div></div><button id="addBtn" class="primary big">＋ Gider Ekle</button><button id="addIncomeBtn" class="secondary big">＋ Gelir Ekle</button><section class="panel"><div class="sectionHead"><h2>Son İşlemler</h2><span id="userLabel" class="muted"></span></div><div id="transactions" class="transactions"></div></section></section></main><dialog id="entryDialog"><form method="dialog" id="entryForm"><h2 id="dialogTitle">Gider Ekle</h2><input type="number" id="amount" step=".01" min="0" placeholder="Tutar (TL)" required><select id="category"><option>Kira</option><option>Market</option><option>Yakıt</option><option>Yemek</option><option>Fatura</option><option>Alışveriş</option><option>Sağlık</option><option>Ulaşım</option><option>Diğer</option></select><input id="note" maxlength="120" placeholder="Açıklama (isteğe bağlı)"><input id="date" type="date" required><div class="row"><button value="cancel" class="secondary">İptal</button><button id="saveBtn" value="default" class="primary">Kaydet</button></div></form></dialog><script type="module" src="app.js"></script></body></html>
